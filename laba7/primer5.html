<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Список со множественным выбором</title>
</head>
<body>
    <form name="myForm">
        <select name="languages" multiple size="5">
            <option value="JS"  selected>JavaScript</option>
            <option value="Java">Java</option>
            <option value="CS">C#</option>
            <option value="CPP">C++</option>
            <option value="PY">Python</option>
            <option value="PHP">PHP</option>
        </select>
    </form>
    <div id="selection"></div>

    <script>
        const languages = document.myForm.languages;
        const selection = document.getElementById("selection");

        function changeOption() {
            // удаляем ранее выбранные элементы
            while (selection.firstChild) {
                selection.removeChild(selection.firstChild);
            }

            // получаем выбранные элементы
            const options = languages.selectedOptions;

            for (let i = 0; i < options.length; i++) {
                const option = options[i].text;      // текст выбранного элемента
                const div = document.createElement("div");
                const optionText = document.createTextNode(option);
                div.appendChild(optionText);
                selection.appendChild(div);
            }
        }

        languages.addEventListener("change", changeOption);
    </script>
</body>
</html>
