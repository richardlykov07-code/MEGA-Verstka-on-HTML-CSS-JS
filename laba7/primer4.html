<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Пример 4. Событие change</title>
</head>
<body>
    <form name="myForm">
        <select name="language" size="5">
            <option value="JS" selected="selected">JavaScript</option>
            <option value="Java">Java</option>
            <option value="CS">C#</option>
            <option value="CPP">C++</option>
        </select>
    </form>
    <div id="selection"></div>

    <script>
        const languagesSelect = document.myForm.language;
        const selection = document.getElementById("selection");

        function changeOption() {
            const selectedOption =
                languagesSelect.options[languagesSelect.selectedIndex];
            selection.textContent = "Вы выбрали: " + selectedOption.text;
        }

        languagesSelect.addEventListener("change", changeOption);

        // сразу показать значение по умолчанию
        changeOption();
    </script>
</body>
</html>
