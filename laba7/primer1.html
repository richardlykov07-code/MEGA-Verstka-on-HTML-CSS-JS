<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Пример 1. Список и текстовое поле</title>
</head>
<body>
    <form name="myForm">
        <p>
            <label>Выберите язык программирования:</label><br />
            <select name="language" size="1">
                <option value="JS" selected="selected">JavaScript</option>
                <option value="Java">Java</option>
                <option value="CS">C#</option>
                <option value="CPP">C++</option>
                <option value="PY">Python</option>
                <option value="PHP">PHP</option>
            </select>
        </p>
        <p>
            <label>Значение выбранного варианта:</label><br />
            <input type="text" name="result" size="30" readonly />
        </p>
    </form>

    <script>
        const myForm = document.myForm;
        const languageSelect = myForm.language;
        const resultBox = myForm.result;

        // при изменении выбора выводим значение в текстовое поле
        languageSelect.addEventListener("change", function () {
            resultBox.value = languageSelect.value;
        });

        // сразу выводим значение по умолчанию
        resultBox.value = languageSelect.value;
    </script>
</body>
</html>
