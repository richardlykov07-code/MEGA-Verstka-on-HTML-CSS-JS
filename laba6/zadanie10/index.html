<!DOCTYPE html>

<head>

</head>

<body>
    <script>
        function getMaxSubSum(arr) {
            let maxSum = 0;
            let currentSum = 0;

            for (let x of arr) {
                currentSum += x;

                if (currentSum > maxSum) {
                    maxSum = currentSum;
                }

                if (currentSum < 0) {
                    currentSum = 0;
                }
            }

            return maxSum;
        }

        alert(getMaxSubSum([1, -2, 3, 4, -9, 6])); // 67 хыхыыхыхыххы
    </script>

</body>

</html>
