<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const matrix = [
            [1, 3, 6],
            [9, 12, 14],
            [15, 16, 18]
        ];

        let count = 0;

        for (let i = 0; i < matrix.length; i++) {
            for (let j = 0; j < matrix[i].length; j++) {
                if (matrix[i][j] % 3 === 0) {
                    count++;
                }
            }
        }

        alert("Количество чисел, кратных 3: " + count); // 6
    </script>
</body>

</html>
