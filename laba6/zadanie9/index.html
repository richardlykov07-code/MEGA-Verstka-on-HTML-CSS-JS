<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function sumInput() {
            const arr = [];
            let input = prompt("Введите последовательность чисел через пробел (например: 1 2 3 4):");
            arr.push(...input.split(" ").map(Number));
            console.log(arr);
            return arr.reduce((sum, x) => sum + x, 0);
        }

        alert(sumInput());
    </script>

</body>

</html>
