<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function maxElement(arr) {
            return Math.max(...arr);
        }

        function minElement(arr) {
            return Math.min(...arr);
        }
        const b = [1.2, -3.5, 4.8, -2.1, 5.0];

        alert("Максимум: " + maxElement(b));
        alert("Минимум: " + minElement(b));
    </script>
</body>

</html>
