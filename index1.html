<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>КР7</title>
</head>

<body>
    <script>
        // 1. Создаем двумерный массив (матрицу)
        // Для примера 4 на 4
        let matrix = [
            [5, 2, 9, 1],
            [4, 5, 6, 8],
            [7, 5, 3, 2],
            [1, 0, 5, 4]
        ];

        // 2. Задаем начальные значения для подсчета
        let count5 = 0;
        let min = matrix[0][0];
        let max = matrix[0][0];
        let sumDiagonal = 0;

        // 3. Проходим по матрице двумя циклами for
        for (let i = 0; i < matrix.length; i++) {
            for (let j = 0; j < matrix[i].length; j++) {

                let element = matrix[i][j];

                // Считаем количество цифр «5»
                if (element === 5) {
                    count5++;
                }

                // Ищем минимальное значение
                if (element < min) {
                    min = element;
                }

                // Ищем максимальное значение
                if (element > max) {
                    max = element;
                }

                // Считаем сумму по главной диагонали
                if (i === j) {
                    sumDiagonal += element;
                }
            }
        }

        // 4. Выводим результаты через document.write с использованием <br>
        document.write("<h2>Результаты контрольной работы:</h2>");
        document.write("Количество цифр «5»: " + count5 + "<br>");
        document.write("Минимальное значение: " + min + "<br>");
        document.write("Максимальное значение: " + max + "<br>");
        document.write("Сумма по главной диагонали: " + sumDiagonal + "<br>");
    </script>
</body>

</html>
